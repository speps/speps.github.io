<!DOCTYPE HTML>
<html>
<head>
	<meta charset="UTF-8"/>
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no"/>
	<title>Masking Demo</title>
	<style>
		* { margin:0; padding:0; box-sizing:border-box; }
		html,body { width:100%; height:100%; overflow:hidden; background:#111; }
		canvas { display:block; width:100%; height:100%; }
		#toolbar { position:fixed; top:0; left:0; right:0; z-index:10; display:flex; gap:6px; padding:8px 12px; background:rgba(0,0,0,0.7); backdrop-filter:blur(4px); font:13px/1.4 system-ui,sans-serif; color:#ccc; }
		#toolbar label { display:flex; align-items:center; gap:4px; cursor:pointer; user-select:none; padding:2px 8px; border-radius:4px; transition:background .15s; }
		#toolbar label:hover { background:rgba(255,255,255,.1); }
		#toolbar input { accent-color:#6af; }
	</style>
</head>
<body>
	<div id="toolbar"><label><input type="checkbox" checked id="toggleWireframe"> Wireframe</label><label><input type="checkbox" checked id="toggleBoatMesh"> Boat mesh</label><label><input type="checkbox" checked id="toggleBoatMask"> Boat mask</label></div>
	<canvas id="gpuCanvas"></canvas>
	<script src="main.js"></script>
</body>
</html>
